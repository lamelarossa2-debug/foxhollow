name: PS4 homebrew PKG test

on:
  push:
    branches:
      - ps4-homebrew-smoke-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ps4-pkg:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Download matching OpenOrbis v0.5.4 toolchain and source
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --connect-timeout 20 \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            --output /tmp/openorbis-v0.5.4.tar.gz
          mkdir -p ps4sdk
          tar -xzf /tmp/openorbis-v0.5.4.tar.gz -C ps4sdk --strip-components=2
          test -f ps4sdk/link.x
          test -x ps4sdk/bin/linux/create-fself
          ls -lh ps4sdk/bin/linux/

      - name: Compile modules, graphics demo and PS4 PKG
        run: |
          set -euxo pipefail
          export OO_PS4_TOOLCHAIN="$GITHUB_WORKSPACE/ps4sdk"
          export PATH="$OO_PS4_TOOLCHAIN/bin/linux:$PATH"
          sudo apt-get update -qq
          sudo apt-get install -y lld-18
          ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld
          clang --version
          ld.lld --version

          cd ps4sdk/src/modules
          bash build-and-copy.sh

          test -f "$GITHUB_WORKSPACE/ps4sdk/samples/graphics/sce_module/libc.prx"
          test -f "$GITHUB_WORKSPACE/ps4sdk/samples/graphics/sce_module/libSceFios2.prx"
          test -f "$GITHUB_WORKSPACE/ps4sdk/samples/graphics/sce_sys/about/right.sprx"

          cd ../../samples/graphics
          cp "$GITHUB_WORKSPACE/ps4-ascii/main.cpp" graphics/main.cpp
          sed -i 's/OpenOrbis Graphics Sample/ASCII REALM TEST 03/g' Makefile
          sed -i 's/BREW00082/ASCI10003/g' Makefile
          sed -i 's/GRAPHICSEX000000/ASCIIREALM000000/g' Makefile
          sed -i 's/LIBS        := -lc -lkernel -lc++ -lSceVideoOut/LIBS        := -lc -lkernel -lc++ -lSceVideoOut -lScePad -lSceUserService/g' Makefile
          make pkg.gp4

          # OpenOrbis packager requires older OpenSSL libraries. Keep packaging
          # isolated inside the official Ubuntu 20.04 SDK container.
          docker pull openorbisofficial/toolchain:v0.5.1
          docker run --rm --user 0 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/ps4sdk/samples/graphics \
            openorbisofficial/toolchain:v0.5.1 \
            bash -ec 'PkgTool.Core pkg_build pkg.gp4 .'
          ls -lh ./*.pkg

      - name: Verify PS4 package exists
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(ps4sdk/samples/graphics/*.pkg)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::No PKG produced"
            exit 1
          fi
          file "${packages[@]}"
          ls -lh "${packages[@]}"

      - name: Publish PS4 PKG
        uses: actions/upload-artifact@v4
        with:
          name: ASCII-REALM-PS4-TEST-03
          path: ps4sdk/samples/graphics/*.pkg
          if-no-files-found: error
          retention-days: 7
