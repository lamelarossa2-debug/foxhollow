name: PS4 homebrew PKG test

on:
  push:
    branches:
      - ps4-homebrew-smoke-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ps4-pkg:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Checkout official OpenOrbis sources
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/OpenOrbis-PS4-Toolchain
          ref: master
          path: openorbis-source

      - name: Build video test and PS4 package inside OpenOrbis Docker SDK
        run: |
          set -euxo pipefail
          docker pull openorbisofficial/toolchain:v0.5.1
          docker run --rm --user 0 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/openorbis-source \
            openorbisofficial/toolchain:v0.5.1 \
            bash -euc '
              cd src/modules
              bash build-and-copy.sh
              cd ../../samples/graphics
              sed -i "s/OpenOrbis Graphics Sample/ROBERTO PS4 TEST/g" Makefile
              sed -i "s/BREW00082/ASCI10001/g" Makefile
              sed -i "s/GRAPHICSEX000000/ASCII3DTEST00000/g" Makefile
              make
              ls -lh ./*.pkg
            '

      - name: Make sure a real PKG was created
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(openorbis-source/samples/graphics/*.pkg)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::The toolchain did not produce a PS4 PKG"
            exit 1
          fi
          file "${packages[@]}"
          ls -lh "${packages[@]}"

      - name: Upload installable PS4 PKG
        uses: actions/upload-artifact@v4
        with:
          name: ROBERTO-PS4-TEST-PKG
          path: openorbis-source/samples/graphics/*.pkg
          if-no-files-found: error
          retention-days: 7
